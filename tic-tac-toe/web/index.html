<!doctype html>
<meta charset="utf-8"><title>Tic-Tac-Toe vs Net</title>
<style>
  body{font-family:sans-serif;text-align:center;margin-top:30px}
  #board{display:grid;grid-template-columns:repeat(3,100px);gap:4px;justify-content:center;margin:20px auto}
  .c{width:100px;height:100px;font-size:48px;background:#eee;border:0;cursor:pointer}
</style>
<h2>Tic-Tac-Toe vs the Net</h2>
<label><input type="checkbox" id="first"> Net goes first</label>
<button onclick="reset()">New game</button>
<div id="board"></div>
<div id="status"></div>
<script>
const LINES=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
let b, over;
const el=document.getElementById('board'), st=document.getElementById('status');
const sym={1:'X',[-1]:'O',0:''};
function winner(){for(const[a,c,d]of LINES)if(b[a]&&b[a]==b[c]&&b[c]==b[d])return b[a];return 0}
function render(){
  el.innerHTML='';
  b.forEach((v,i)=>{const x=document.createElement('button');x.className='c';x.textContent=sym[v];x.onclick=()=>click(i);el.appendChild(x)});
}
function check(){
  const w=winner();
  if(w||!b.includes(0)){over=true;st.textContent=w==humanSide?'You win!':w?'Net wins!':'Draw';return true}
  return false;
}
async function netMove(){
  st.textContent='Net thinking...';
  const r=await fetch('/',{method:'POST',body:JSON.stringify({board:b,ai:-humanSide})});
  b[(await r.json()).move]=-humanSide; render();
  if(!check())st.textContent='Your turn';
}
function click(i){
  if(over||b[i])return;
  b[i]=humanSide; render();
  if(!check())netMove();
}
let humanSide;
function reset(){
  b=Array(9).fill(0); over=false;
  humanSide=document.getElementById('first').checked?-1:1; // X always moves first
  render();
  if(humanSide==-1)netMove(); else st.textContent='Your turn';
}
reset();
</script>
